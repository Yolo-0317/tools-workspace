# Home Hub 本地服务目录（凭据只写 env 变量名，不写明文）
# 端口以本机 docker ps / lsof 为准（2026-05-31 核对）
domains:
  base: yoloworld.site
  external_https_port: 8883
  internal_https_port: 8443

categories:
  - id: stock
    name: 投资链路
    items:
      - id: mysql
        name: MySQL stock_data
        description: 行情 + 持仓 + 选股 + 看板快照
        local_url: http://127.0.0.1:3306
        docker_container: mysql8
        compose_dir: ~/dev/yolo/tools-workspace/stock-mysql
        health:
          type: tcp
          host: 127.0.0.1
          port: 3306
        credentials_env:
          - MYSQL_USER
          - MYSQL_PASSWORD
          - MYSQL_ROOT_PASSWORD

      - id: home-hub
        name: Home Hub
        description: 本看板 + Cursor 聊天（launchd 单服务 :8780）
        local_url: http://127.0.0.1:8780/hub/
        public_url: https://hub.yoloworld.site:8883/hub/
        health:
          type: http
          url: http://127.0.0.1:8780/api/health
        credentials_env:
          - HUB_API_TOKEN
          - HUB_BASIC_AUTH_USER
          - HUB_BASIC_AUTH_PASSWORD

      - id: english-buddy
        name: English Buddy
        description: 少儿英文语音带读（Ollama + Whisper + edge-tts，hub 子路径 /english）
        local_url: http://192.168.1.13:18787/english/
        public_url: https://hub.yoloworld.site:8883/english/
        compose_dir: ~/dev/yolo/tools-workspace/english-buddy
        doc: english-buddy/README.md
        health:
          type: http
          url: http://127.0.0.1:18787/english/api/health
        credentials_env: []

      - id: readalong
        name: Readalong
        description: 有声书句级带读（EPUB + MP3 同步高亮，hub 子路径 /readalong，不经 Hub 登录）
        local_url: http://192.168.1.13:8791/web/
        public_url: https://hub.yoloworld.site:8883/readalong/web/
        compose_dir: ~/dev/yolo/tools-workspace/readalong
        doc: readalong/README.md
        health:
          type: http
          url: http://127.0.0.1:8791/api/health
        credentials_env: []

      - id: wechat-acp
        name: 微信 ↔ Cursor
        description: wechat-cursor-acp / agent acp（无固定 HTTP 端口，看 launchd）
        compose_dir: ~/dev/yolo/tools-workspace/wechat-cursor-acp
        doc: wechat-cursor-acp/README.md
        health:
          type: process
          match: wechat-acp
        credentials_env:
          - WECHAT_ACP_INSTANCE

  - id: media
    name: 媒体
    items:
      - id: jellyfin
        name: Jellyfin
        description: NAS-影音 / 儿童库；外网经 Caddy 反代（alist 子域仅 /jellyfin，已弃用 WebDAV）
        local_url: http://127.0.0.1:8096/jellyfin
        public_url: https://alist.yoloworld.site:8883/jellyfin
        docker_container: jellyfin
        compose_dir: ~/docker/jellyfin-stack
        health:
          type: http
          url: http://127.0.0.1:8096/health
        credentials_env:
          - JELLYFIN_USER
          - JELLYFIN_PASS
          - NAS_HOST
          - NAS_USER
          - NAS_PASS

  - id: infra
    name: 基础设施
    items:
      - id: caddy
        name: Caddy (sidestore-infra)
        description: HTTPS 反代 + 证书；内网 8443 / 外网 8883 均映射容器 443
        local_url: https://127.0.0.1:8443
        public_note: 外网 https://*.{base}:8883
        docker_container: sidestore-caddy
        compose_dir: ~/dev/yolo/tools-workspace/sidestore-infra
        health:
          type: tcp
          host: 127.0.0.1
          port: 8443
        health_note: 8443/8883 均映射容器 443；HTTPS 需带正确子域 SNI

      - id: substore
        name: Sub-Store
        local_url: http://127.0.0.1:3001
        public_url: https://sub.yoloworld.site:8883/sub-store/
        docker_container: substore-clash-store
        compose_dir: ~/dev/yolo/tools-workspace/substore-clash
        health:
          type: tcp
          host: 127.0.0.1
          port: 3001

      - id: clash-gen
        name: Clash 订阅生成（完整版）
        description: Mihomo / Stash / ClashMi；含 Loyalsoldier 在线规则集
        local_url: http://127.0.0.1:8787/clash.yaml
        public_url: https://sub.yoloworld.site:8883/clash.yaml
        docker_container: substore-clash-gen
        compose_dir: ~/dev/yolo/tools-workspace/substore-clash
        health:
          type: http
          url: http://127.0.0.1:8787/clash.yaml

      - id: clash-verge
        name: Clash Verge 轻量订阅
        description: 无 rule-providers，避免 Verge 首次导入长时间转圈；与 clash-gen 同容器
        local_url: http://127.0.0.1:8787/clash-verge.yaml
        public_url: https://sub.yoloworld.site:8883/clash-verge.yaml
        docker_container: substore-clash-gen
        compose_dir: ~/dev/yolo/tools-workspace/substore-clash
        health:
          type: http
          url: http://127.0.0.1:8787/clash-verge.yaml

      - id: anisette
        name: Anisette (SideStore)
        local_url: http://127.0.0.1:6969
        public_url: https://ani.yoloworld.site:8883
        docker_container: sidestore-anisette
        health:
          type: tcp
          host: 127.0.0.1
          port: 6969

jellyfin:
  stack_dir: ~/docker/jellyfin-stack
  staging_lists:
    - file: jellyfin/config/nas-tv-staging.list
      library: NAS-影音
      staging_prefix: /media/nas-tv
      format: nas-tv
    - file: jellyfin/config/sd-tv-staging.list
      library: NAS-影音
      staging_prefix: /media/sd-tv
      format: sd-tv
    - file: jellyfin/config/sd-movies-staging.list
      library: NAS-影音
      staging_prefix: /media/sd-movies
      format: nas-tv
    - file: jellyfin/config/nas-kids-staging.list
      library: 儿童-影音
      staging_prefix: /media/nas-kids
      format: nas-tv
