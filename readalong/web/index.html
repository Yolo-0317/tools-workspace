<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <meta name="description" content="哈利波特有声书句级同步跟读，英文原文 + 中文对照" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HP带读" />
  <base id="base" href="/readalong/web/" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="pwa-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>哈利波特带读</title>
  <style>
    :root {
      --bg: #0e1116;
      --surface: #171c24;
      --surface2: #1f2630;
      --text: #eef2f7;
      --muted: #8b97a8;
      --active: #f0b429;
      --accent: #5b9dff;
      --line: #2a3342;
      --player-h: 13.5rem;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --topbar-h: calc(3.4rem + var(--safe-t));
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    button { font: inherit; }
    .app {
      min-height: 100dvh;
      padding-bottom: calc(var(--player-h) + var(--safe-b) + 1rem);
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding:
        calc(0.65rem + var(--safe-t))
        max(1rem, env(safe-area-inset-right, 0px))
        0.65rem
        max(1rem, env(safe-area-inset-left, 0px));
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar__info { min-width: 0; }
    .topbar__book {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar__ch {
      margin: 0.15rem 0 0;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-ghost {
      flex-shrink: 0;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-ghost:hover { border-color: #3d4d63; }
    .btn-ghost:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .lyrics {
      max-width: 46rem;
      margin: 0 auto;
      padding: 0.5rem 0.85rem 1rem;
      font-family: Georgia, "Iowan Old Style", serif;
      line-height: 1.7;
    }
    .sentence {
      display: grid;
      grid-template-columns: 3.25rem 1fr;
      column-gap: 0.65rem;
      align-items: start;
      padding: 0.5rem 0.55rem;
      border-radius: 0.55rem;
      margin: 0.12rem 0;
      cursor: pointer;
    }
    .sentence:hover { background: #151b24; }
    .sentence.active {
      background: #1c2430;
      box-shadow: inset 3px 0 0 var(--active);
    }
    .sentence.low { opacity: 0.55; }
    .time {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      padding-top: 0.1rem;
    }
    .sentence.active .time { color: var(--active); }
    .sentence__body { min-width: 0; }
    .sentence .en { margin: 0; }
    .sentence .zh {
      margin: 0.38rem 0 0;
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .sentence.active .zh { color: #b8c9de; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1.5rem;
      font-size: 0.95rem;
    }

    /* Chapter switch loading */
    .chapter-busy {
      padding: 2rem 1rem 1.5rem;
      text-align: center;
    }
    .chapter-busy__spinner {
      width: 2.25rem;
      height: 2.25rem;
      margin: 0 auto 1rem;
      border: 3px solid #2a3342;
      border-top-color: var(--active);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chapter-busy__title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .chapter-busy__sub {
      margin: 0.4rem 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .chapter-busy__bar {
      height: 0.25rem;
      margin: 1rem auto 0;
      max-width: 12rem;
      background: #2a3342;
      border-radius: 999px;
      overflow: hidden;
    }
    .chapter-busy__bar-fill {
      height: 100%;
      width: 0%;
      background: var(--active);
      border-radius: 999px;
      transition: width 0.2s ease;
    }
    .chapter-busy__skeleton {
      margin-top: 2rem;
      text-align: left;
      max-width: 46rem;
      margin-inline: auto;
      padding: 0 0.55rem;
    }
    .sk-line {
      height: 0.72rem;
      margin: 0.65rem 0;
      border-radius: 0.35rem;
      background: linear-gradient(90deg, #1a2130 25%, #243044 50%, #1a2130 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }
    .sk-line:nth-child(odd) { width: 92%; }
    .sk-line:nth-child(even) { width: 78%; margin-left: 3.8rem; }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .chapter-item.is-loading {
      pointer-events: none;
      opacity: 0.7;
    }
    .chapter-item.is-loading .chapter-item__meta::after {
      content: " …";
      color: var(--active);
    }

    /* Bottom player — podcast / audiobook style */
    .player {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      padding: 0.75rem 1rem calc(0.75rem + var(--safe-b));
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.35);
    }
    .player__inner { max-width: 46rem; margin: 0 auto; }
    .player__meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.55rem;
    }
    .player__cover {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 0.5rem;
      background: #1a2433;
      overflow: hidden;
      flex-shrink: 0;
    }
    .player__cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .player__titles { min-width: 0; flex: 1; }
    .player__title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player__sub {
      margin: 0.1rem 0 0;
      font-size: 0.76rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player__list-btn {
      appearance: none;
      border: none;
      background: var(--surface2);
      color: var(--text);
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .player__transport {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-top: 0.15rem;
    }
    .player__playbtns {
      position: relative;
      width: 3.5rem;
      height: 3.5rem;
      flex-shrink: 0;
    }
    .btn-play {
      appearance: none;
      border: none;
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 50%;
      background: var(--active);
      color: #1a1408;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 16px rgba(240, 180, 41, 0.35);
    }
    .player__playbtns .btn-play {
      position: absolute;
      inset: 0;
    }
    .btn-play:active { transform: scale(0.96); }
    .btn-play:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    .btn-play[hidden] { display: none; }
    .btn-play__svg {
      display: block;
      width: 1.35rem;
      height: 1.35rem;
      fill: currentColor;
    }
    .player__timeline {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .player__seek {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 0.35rem;
      border-radius: 999px;
      background: #2a3342;
      outline: none;
      cursor: pointer;
    }
    .player__seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: var(--active);
      border: 2px solid #1a1408;
      box-shadow: 0 0 0 2px rgba(240, 180, 41, 0.25);
    }
    .player__seek::-moz-range-thumb {
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: var(--active);
      border: 2px solid #1a1408;
    }
    .player__times {
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .player__error {
      margin: 0.35rem 0 0;
      font-size: 0.76rem;
      color: #f07178;
      display: none;
    }
    .player__error.visible { display: block; }
    .player audio { display: none; }
    .player__toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.45rem;
    }
    .speed {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      min-width: 0;
    }
    .btn-refresh {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.78rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-refresh:hover { border-color: #3d4d63; }
    .btn-refresh:disabled { opacity: 0.55; cursor: wait; }
    .speed__label { font-size: 0.76rem; color: var(--muted); }
    .speed__btn {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 0.74rem;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .speed__btn.active {
      border-color: var(--active);
      color: var(--active);
      background: #2a2418;
    }
    .stats { font-size: 0.72rem; color: var(--muted); margin-top: 0.35rem; }

    /* Chapter sheet */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 11;
      max-height: min(78dvh, 640px);
      background: var(--surface);
      border-radius: 1rem 1rem 0 0;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      padding-bottom: var(--safe-b);
    }
    .sheet.open { transform: translateY(0); }
    .sheet__handle {
      width: 2.5rem;
      height: 0.28rem;
      background: #3a4556;
      border-radius: 999px;
      margin: 0.55rem auto 0;
    }
    .sheet__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem 0.5rem;
      border-bottom: 1px solid var(--line);
    }
    .sheet__head h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .sheet__head p {
      margin: 0.2rem 0 0;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .sheet__close {
      appearance: none;
      border: none;
      background: var(--surface2);
      color: var(--muted);
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .chapter-list {
      overflow: auto;
      padding: 0.35rem 0 0.75rem;
    }
    .chapter-item {
      display: grid;
      grid-template-columns: 2.5rem 1fr auto;
      gap: 0.65rem;
      align-items: center;
      width: 100%;
      text-align: left;
      appearance: none;
      border: none;
      background: transparent;
      color: inherit;
      padding: 0.75rem 1rem;
      cursor: pointer;
    }
    .chapter-item:hover:not(:disabled) { background: #1a2130; }
    .chapter-item:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .chapter-item.active { background: #1c2430; }
    .chapter-item__num {
      font-size: 0.82rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .chapter-item.active .chapter-item__num { color: var(--active); }
    .chapter-item__title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .chapter-item__sub {
      margin: 0.15rem 0 0;
      font-size: 0.76rem;
      color: var(--muted);
    }
    .chapter-item__meta {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
    }
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      padding: 0.12rem 0.4rem;
      border-radius: 999px;
      background: #243044;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .badge--ready { background: #1a2e22; color: #7dcea0; }
    @media (min-width: 768px) {
      .sheet {
        left: auto;
        width: 24rem;
        max-height: 100dvh;
        border-radius: 1rem 0 0 0;
        transform: translateX(100%);
      }
      .sheet.open { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar__info">
        <p class="topbar__book" id="book-title">Readalong</p>
        <p class="topbar__ch" id="chapter-label">加载中…</p>
      </div>
      <button type="button" class="btn-ghost" id="open-chapters">目录</button>
    </header>
    <main class="lyrics" id="lines"></main>
  </div>

  <footer class="player">
    <div class="player__inner">
      <div class="player__meta">
        <div class="player__cover" aria-hidden="true">
          <img src="pwa-192.png" width="44" height="44" alt="" />
        </div>
        <div class="player__titles">
          <p class="player__title" id="player-title">—</p>
          <p class="player__sub" id="player-sub">—</p>
        </div>
        <button type="button" class="player__list-btn" id="open-chapters-2" title="章节目录">☰</button>
      </div>
      <div class="player__transport">
        <div class="player__playbtns">
          <button type="button" class="btn-play" id="btn-play" aria-label="播放" disabled>
            <svg class="btn-play__svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button type="button" class="btn-play" id="btn-pause" aria-label="暂停" hidden disabled>
            <svg class="btn-play__svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
        </div>
        <div class="player__timeline">
          <input type="range" class="player__seek" id="player-seek" min="0" max="1000" value="0" aria-label="播放进度" />
          <div class="player__times">
            <span id="time-cur">0:00</span>
            <span id="time-dur">0:00</span>
          </div>
        </div>
      </div>
      <p class="player__error" id="player-error"></p>
      <audio id="player" preload="metadata"></audio>
      <div class="player__toolbar">
        <div class="speed" id="speed" aria-label="语速">
          <span class="speed__label">语速</span>
        </div>
        <button type="button" class="btn-refresh" id="force-refresh" title="清缓存并重新加载">刷新</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </footer>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <aside class="sheet" id="chapter-sheet" aria-label="章节目录">
    <div class="sheet__handle"></div>
    <div class="sheet__head">
      <div>
        <h2>章节目录</h2>
        <p id="sheet-sub">魔法石 · 17 章</p>
      </div>
      <button type="button" class="sheet__close" id="close-chapters" aria-label="关闭">×</button>
    </div>
    <div class="chapter-list" id="chapter-list"></div>
  </aside>

  <script>
    (function cleanCacheBustParam() {
      const url = new URL(location.href);
      if (!url.searchParams.has("_")) return;
      url.searchParams.delete("_");
      history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
    })();

    const params = new URLSearchParams(location.search);
    const hubBase = (location.pathname.match(/^(\/readalong)(?=\/|$)/) || [])[1] || "";
    const webBase = hubBase ? `${hubBase}/web` : "/web";
    const baseEl = document.getElementById("base");
    if (baseEl) baseEl.href = `${webBase}/`;
    const root = hubBase || "";

    let hardRefreshing = false;

    async function clearAllCaches() {
      if (!("caches" in window)) return;
      const keys = await caches.keys();
      await Promise.all(keys.map((key) => caches.delete(key)));
    }

    async function unregisterServiceWorkers() {
      if (!("serviceWorker" in navigator)) return;
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((reg) => reg.unregister()));
    }

    async function forceRefresh() {
      const btn = document.getElementById("force-refresh");
      if (btn?.disabled) return;
      if (btn) btn.disabled = true;
      hardRefreshing = true;
      try {
        await clearAllCaches();
        await unregisterServiceWorkers();
      } catch {
        /* ignore */
      }
      const url = new URL(location.href);
      url.searchParams.delete("_");
      url.searchParams.set("_", String(Date.now()));
      location.replace(url.toString());
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register(`${webBase}/sw.js`, { scope: `${webBase}/` })
          .then((registration) => {
            registration.addEventListener("updatefound", () => {
              const installing = registration.installing;
              if (!installing) return;
              installing.addEventListener("statechange", () => {
                if (installing.state === "installed" && navigator.serviceWorker.controller && !hardRefreshing) {
                  window.location.reload();
                }
              });
            });
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") void registration.update();
            });
            window.setInterval(() => void registration.update(), 60 * 60 * 1000);
          })
          .catch(() => {});
      });
    }
    registerServiceWorker();

    const bookTitleEl = document.getElementById("book-title");
    const chapterLabelEl = document.getElementById("chapter-label");
    const playerTitleEl = document.getElementById("player-title");
    const playerSubEl = document.getElementById("player-sub");
    const statsEl = document.getElementById("stats");
    const linesEl = document.getElementById("lines");
    const player = document.getElementById("player");
    const btnPlay = document.getElementById("btn-play");
    const btnPause = document.getElementById("btn-pause");
    const playerSeek = document.getElementById("player-seek");
    const timeCurEl = document.getElementById("time-cur");
    const timeDurEl = document.getElementById("time-dur");
    const playerErrorEl = document.getElementById("player-error");
    const speedEl = document.getElementById("speed");
    const chapterListEl = document.getElementById("chapter-list");
    const sheetEl = document.getElementById("chapter-sheet");
    const sheetBackdrop = document.getElementById("sheet-backdrop");
    const sheetSubEl = document.getElementById("sheet-sub");

    const SPEED_PRESETS = [
      { label: "0.75×", rate: 0.75 },
      { label: "1×", rate: 1 },
      { label: "1.25×", rate: 1.25 },
      { label: "1.5×", rate: 1.5 },
    ];
    const SPEED_KEY = "readalong_playback_rate";
    const CHAPTER_KEY = "readalong_last_chapter";

    let catalog = null;
    let currentChapter = null;
    let lines = [];
    let active = -1;
    let lineEls = [];
    let userScrolling = false;
    let scrollIdleTimer = 0;
    let playbackRate = 1;
    let seeking = false;
    let switching = false;
    let switchSeq = 0;
    const manifestCache = new Map();

    function fmt(sec) {
      if (sec == null || Number.isNaN(sec)) return "—";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function openSheet() {
      sheetEl.classList.add("open");
      sheetBackdrop.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeSheet() {
      sheetEl.classList.remove("open");
      sheetBackdrop.classList.remove("open");
      document.body.style.overflow = "";
    }

    function loadSpeed() {
      const saved = Number(localStorage.getItem(SPEED_KEY));
      const hit = SPEED_PRESETS.find((p) => p.rate === saved);
      return hit ? hit.rate : 1;
    }
    function applySpeed(rate) {
      playbackRate = rate;
      player.playbackRate = rate;
      localStorage.setItem(SPEED_KEY, String(rate));
      speedEl.querySelectorAll(".speed__btn").forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.rate) === rate);
      });
    }
    function initSpeedControls() {
      SPEED_PRESETS.forEach((preset) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "speed__btn";
        btn.dataset.rate = String(preset.rate);
        btn.textContent = preset.label;
        btn.addEventListener("click", () => applySpeed(preset.rate));
        speedEl.appendChild(btn);
      });
      applySpeed(loadSpeed());
    }

    function setPlayerError(msg) {
      if (!msg) {
        playerErrorEl.textContent = "";
        playerErrorEl.classList.remove("visible");
        return;
      }
      playerErrorEl.textContent = msg;
      playerErrorEl.classList.add("visible");
    }

    function syncPlayButton() {
      const playing = !player.paused && !player.ended;
      const canControl = !player.error && !!player.src;
      btnPlay.hidden = playing;
      btnPause.hidden = !playing;
      btnPlay.disabled = !canControl || playing;
      btnPause.disabled = !canControl || !playing;
    }

    function updateSeekUi() {
      if (seeking) return;
      const dur = player.duration;
      if (!dur || !Number.isFinite(dur)) {
        playerSeek.value = "0";
        timeCurEl.textContent = "0:00";
        timeDurEl.textContent = "0:00";
        return;
      }
      playerSeek.value = String(Math.round((player.currentTime / dur) * 1000));
      timeCurEl.textContent = fmt(player.currentTime);
      timeDurEl.textContent = fmt(dur);
    }

    function initPlayerControls() {
      btnPlay.addEventListener("click", () => {
        if (player.error || !player.src) return;
        void player.play();
      });
      btnPause.addEventListener("click", () => {
        if (player.error || !player.src) return;
        player.pause();
      });

      playerSeek.addEventListener("input", () => {
        seeking = true;
        const dur = player.duration;
        if (dur && Number.isFinite(dur)) {
          const t = (Number(playerSeek.value) / 1000) * dur;
          timeCurEl.textContent = fmt(t);
        }
      });
      playerSeek.addEventListener("change", () => {
        const dur = player.duration;
        if (dur && Number.isFinite(dur)) {
          player.currentTime = (Number(playerSeek.value) / 1000) * dur;
        }
        seeking = false;
      });

      player.addEventListener("play", () => {
        userScrolling = false;
        player.playbackRate = playbackRate;
        syncPlayButton();
      });
      player.addEventListener("pause", syncPlayButton);
      player.addEventListener("ended", syncPlayButton);
      player.addEventListener("loadedmetadata", () => {
        player.playbackRate = playbackRate;
        btnPlay.disabled = false;
        syncPlayButton();
        updateSeekUi();
      });
      player.addEventListener("timeupdate", () => {
        updateSeekUi();
      });
      player.addEventListener("error", () => {
        btnPlay.disabled = true;
        btnPause.disabled = true;
        syncPlayButton();
        const code = player.error?.code;
        setPlayerError(
          code === 4
            ? "音频无法加载，请确认 samples/hp01/chapterNN.mp3 在本机且非外链符号链接"
            : "音频播放失败，请点「刷新」后重试"
        );
      });
    }

    function renderChapterList() {
      chapterListEl.innerHTML = "";
      if (!catalog) return;
      catalog.chapters.forEach((ch) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.pad = ch.pad;
        btn.className = "chapter-item" + (currentChapter?.pad === ch.pad ? " active" : "");
        btn.disabled = !ch.ready;
        btn.innerHTML =
          `<span class="chapter-item__num">${ch.pad}</span>` +
          `<div>` +
          `<p class="chapter-item__title">${ch.title_zh}</p>` +
          `<p class="chapter-item__sub">${ch.title_en}</p>` +
          (ch.ready
            ? `<span class="badge badge--ready">可播放</span>`
            : `<span class="badge">${ch.has_audio ? "待对齐" : "待音频"}</span>`) +
          `</div>` +
          `<span class="chapter-item__meta">${ch.ready ? fmt(ch.duration_sec) : "—"}</span>`;
        btn.addEventListener("click", () => {
          if (!ch.ready || switching) return;
          closeSheet();
          void switchChapter(ch);
        });
        chapterListEl.appendChild(btn);
      });
    }

    function updateChapterListActive(loadingPad) {
      chapterListEl.querySelectorAll(".chapter-item").forEach((btn) => {
        const pad = btn.dataset.pad;
        btn.classList.toggle("active", pad === currentChapter?.pad);
        btn.classList.toggle("is-loading", !!loadingPad && pad === loadingPad);
      });
    }

    function showChapterLoading(ch, step, pct) {
      const skeleton = Array.from({ length: 6 }, () => '<div class="sk-line"></div>').join("");
      linesEl.innerHTML =
        `<div class="chapter-busy" role="status" aria-live="polite">` +
        `<div class="chapter-busy__spinner" aria-hidden="true"></div>` +
        `<p class="chapter-busy__title">第 ${ch.id} 章 · ${ch.title_zh}</p>` +
        `<p class="chapter-busy__sub" id="busy-sub">${step}</p>` +
        `<div class="chapter-busy__bar"><div class="chapter-busy__bar-fill" id="busy-bar" style="width:${pct}%"></div></div>` +
        `<div class="chapter-busy__skeleton">${skeleton}</div>` +
        `</div>`;
      lineEls = [];
      active = -1;
    }

    function setChapterLoadingProgress(step, pct) {
      const sub = document.getElementById("busy-sub");
      const bar = document.getElementById("busy-bar");
      if (sub) sub.textContent = step;
      if (bar) bar.style.width = `${Math.min(100, Math.max(0, pct))}%`;
    }

    async function loadManifest(ch) {
      if (manifestCache.has(ch.pad)) return manifestCache.get(ch.pad);
      const res = await fetch(`${root}/${ch.manifest}`);
      if (!res.ok) throw new Error(`manifest ${res.status}`);
      const data = await res.json();
      manifestCache.set(ch.pad, data);
      return data;
    }

    function prefetchManifests() {
      if (!catalog) return;
      catalog.chapters.filter((c) => c.ready).forEach((ch) => {
        void loadManifest(ch).catch(() => {});
      });
    }

    function buildLineElement(line, i) {
      const div = document.createElement("div");
      const low = line.confidence != null && line.confidence < 0.6;
      div.className = "sentence" + (i === active ? " active" : "") + (low ? " low" : "");
      const zh = line.zh ? `<p class="zh">${line.zh}</p>` : "";
      div.innerHTML =
        `<span class="time">${fmt(line.start)}</span>` +
        `<div class="sentence__body"><p class="en">${line.text}</p>${zh}</div>`;
      div.addEventListener("click", () => {
        userScrolling = false;
        player.currentTime = line.start + 0.02;
        void player.play().then(syncPlayButton);
        setActive(i, { forceScroll: true });
      });
      return div;
    }

    async function renderLinesAsync(onProgress) {
      linesEl.innerHTML = "";
      lineEls = [];
      if (!lines.length) {
        linesEl.innerHTML = `<div class="empty">本章暂无字幕数据<br>请运行 <code>./scripts/pipeline.sh ${currentChapter?.id || 1}</code></div>`;
        return;
      }
      const CHUNK = 36;
      for (let start = 0; start < lines.length; start += CHUNK) {
        const frag = document.createDocumentFragment();
        const end = Math.min(start + CHUNK, lines.length);
        for (let i = start; i < end; i++) {
          const div = buildLineElement(lines[i], i);
          frag.appendChild(div);
          lineEls.push(div);
        }
        linesEl.appendChild(frag);
        onProgress?.(end, lines.length);
        if (end < lines.length) {
          await new Promise((r) => requestAnimationFrame(r));
        }
      }
    }

    function waitAudioReady(timeoutMs = 12000) {
      return new Promise((resolve) => {
        if (player.readyState >= 1) {
          resolve();
          return;
        }
        const timer = window.setTimeout(resolve, timeoutMs);
        const onReady = () => {
          clearTimeout(timer);
          player.removeEventListener("loadedmetadata", onReady);
          resolve();
        };
        player.addEventListener("loadedmetadata", onReady);
      });
    }

    function updateChrome(ch, data) {
      const label = `第 ${ch.id} 章 · ${ch.title_zh}`;
      chapterLabelEl.textContent = label;
      playerTitleEl.textContent = ch.title_zh;
      playerSubEl.textContent = ch.title_en;
      document.title = `${ch.title_zh} — Readalong`;
      if (data) {
        const conf = (data.lines || []).filter((l) => l.confidence >= 0.75).length;
        const zhN = (data.lines || []).filter((l) => l.zh).length;
        statsEl.textContent =
          `${data.aligned_sentences || data.lines?.length || 0} 句 · ` +
          `${zhN} 句中文 · 高置信 ${conf} · 起点 ${fmt(data.body_start_sec)}`;
      }
    }

    async function switchChapter(ch, opts = {}) {
      if (!ch.ready) return;
      if (switching && !opts.force) return;
      if (currentChapter?.pad === ch.pad && lines.length && !opts.force) return;

      const seq = ++switchSeq;
      switching = true;
      updateChapterListActive(ch.pad);

      player.pause();
      setPlayerError("");
      btnPlay.disabled = true;
      btnPause.disabled = true;
      syncPlayButton();

      chapterLabelEl.textContent = `第 ${ch.id} 章 · ${ch.title_zh}`;
      playerTitleEl.textContent = ch.title_zh;
      playerSubEl.textContent = ch.title_en;
      showChapterLoading(ch, manifestCache.has(ch.pad) ? "读取缓存字幕…" : "下载字幕…", 8);
      window.scrollTo({ top: 0, behavior: "auto" });

      try {
        const data = await loadManifest(ch);
        if (seq !== switchSeq) return;

        lines = data.lines || [];
        setChapterLoadingProgress(`渲染 ${lines.length} 句…`, 35);

        await renderLinesAsync((done, total) => {
          if (seq !== switchSeq) return;
          const pct = 35 + Math.round((done / total) * 45);
          setChapterLoadingProgress(`渲染字幕 ${done}/${total}…`, pct);
        });
        if (seq !== switchSeq) return;

        currentChapter = ch;
        active = -1;
        localStorage.setItem(CHAPTER_KEY, ch.pad);
        const url = new URL(location.href);
        url.searchParams.set("ch", ch.pad);
        history.replaceState(null, "", url);

        setChapterLoadingProgress("加载音频…", 88);
        player.src = `${root}/${ch.audio}?v=${ch.pad}`;
        player.load();
        player.playbackRate = playbackRate;
        updateChrome(ch, data);
        updateChapterListActive(null);

        await waitAudioReady();
        if (seq !== switchSeq) return;

        setChapterLoadingProgress("完成", 100);
        if (opts.autoplay) void player.play().then(syncPlayButton);
      } catch (e) {
        if (seq !== switchSeq) return;
        linesEl.innerHTML = `<div class="empty">章节加载失败<br>${String(e)}</div>`;
        lineEls = [];
        statsEl.textContent = String(e);
      } finally {
        if (seq === switchSeq) {
          switching = false;
          updateChapterListActive(null);
        }
      }
    }

    function isInView(el) {
      const playerBar = document.querySelector(".player");
      const bottom = playerBar ? playerBar.getBoundingClientRect().top - 16 : window.innerHeight - 120;
      const top = document.querySelector(".topbar")?.offsetHeight ?? 72;
      const rect = el.getBoundingClientRect();
      return rect.top >= top && rect.bottom <= bottom;
    }
    function scrollToLine(el) {
      const top = document.querySelector(".topbar")?.offsetHeight ?? 72;
      const rect = el.getBoundingClientRect();
      const playerBar = document.querySelector(".player");
      const bottomPad = playerBar ? playerBar.offsetHeight + 24 : 160;
      const target = window.scrollY + rect.top - top - (window.innerHeight - top - bottomPad) * 0.3;
      window.scrollTo({ top: Math.max(0, target), behavior: "smooth" });
    }
    function setActive(idx, opts = {}) {
      if (idx === active) return;
      if (active >= 0 && lineEls[active]) lineEls[active].classList.remove("active");
      active = idx;
      const el = lineEls[idx];
      if (!el) return;
      el.classList.add("active");
      if ((opts.forceScroll || !userScrolling) && !isInView(el)) scrollToLine(el);
    }

    window.addEventListener("scroll", () => {
      if (!player.paused) {
        userScrolling = true;
        clearTimeout(scrollIdleTimer);
        scrollIdleTimer = window.setTimeout(() => { userScrolling = false; }, 2500);
      }
    }, { passive: true });

    let lastTick = 0;
    player.addEventListener("timeupdate", () => {
      const now = performance.now();
      if (now - lastTick < 120) return;
      lastTick = now;
      const t = player.currentTime;
      let idx = -1;
      for (let i = 0; i < lines.length; i++) {
        if (t >= lines[i].start && t < lines[i].end) idx = i;
      }
      if (idx >= 0) setActive(idx);
    });

    document.getElementById("open-chapters").addEventListener("click", openSheet);
    document.getElementById("open-chapters-2").addEventListener("click", openSheet);
    document.getElementById("close-chapters").addEventListener("click", closeSheet);
    document.getElementById("force-refresh").addEventListener("click", () => void forceRefresh());
    sheetBackdrop.addEventListener("click", closeSheet);

    initSpeedControls();
    initPlayerControls();

    async function boot() {
      const catRes = await fetch(`${root}/output/catalog.json`);
      catalog = await catRes.json();
      bookTitleEl.textContent = catalog.book_title_zh;
      sheetSubEl.textContent = `${catalog.book_title_zh} · ${catalog.ready_count}/${catalog.chapter_count} 章可播`;
      renderChapterList();
      prefetchManifests();

      const wanted =
        params.get("ch") ||
        localStorage.getItem(CHAPTER_KEY) ||
        catalog.chapters.find((c) => c.ready)?.pad ||
        "01";

      const ch = catalog.chapters.find((c) => c.pad === wanted.padStart(2, "0"));
      if (!ch || !ch.ready) {
        const first = catalog.chapters.find((c) => c.ready);
        if (!first) {
          linesEl.innerHTML = `<div class="empty">暂无可用章节<br>放入 samples/hp01/chapterNN.mp3 后运行 pipeline</div>`;
          renderChapterList();
          return;
        }
        await switchChapter(first);
      } else {
        await switchChapter(ch);
      }
    }

    boot().catch((e) => {
      chapterLabelEl.textContent = "加载失败";
      statsEl.textContent = String(e);
    });
  </script>
</body>
</html>
