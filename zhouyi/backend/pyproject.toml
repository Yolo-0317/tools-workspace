[project]
name = "zhouyi-personal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "pymysql>=1.1,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2", "opencc-python-reimplemented==0.1.7", "lunar_python==1.4.8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "beautifulsoup4>=4.12,<5", "requests>=2.32,<3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
