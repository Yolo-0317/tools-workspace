# Tushare 日线 → MySQL（已合并至 docker/scheduler/，本目录保留兼容）
#
# 请改用：
#   cd ../scheduler && docker compose up -d --build
# 或：
#   ./scripts/install-stock-ai-scheduler.sh

services:
  stock-daily-sync:
    build:
      context: ../..
      dockerfile: docker/daily-sync/Dockerfile
    container_name: stock-daily-sync
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      TZ: Asia/Shanghai
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ../../logs:/app/logs
      - ../../run_sync_daily.sh:/app/run_sync_daily.sh:ro
      - ./crontab:/etc/cron.d/stock-daily-sync:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
