<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenRouter Chat</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1a1d26;
      --border: #2a2f3a;
      --text: #e8eaef;
      --muted: #8b93a7;
      --user: #2a3344;
      --assistant: #1e222c;
      --accent: #5b8def;
      --danger: #d46464;
      --font: "IBM Plex Sans", "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }
    body {
      display: flex;
      flex-direction: column;
      max-width: 820px;
      margin: 0 auto;
      min-height: 100%;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    header .meta {
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }
    select, button, textarea {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    select {
      padding: 6px 10px;
      font-size: 13px;
      max-width: 100%;
    }
    #status {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }
    #status.ok { color: #6fbf8a; }
    #status.bad { color: var(--danger); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      max-width: 28em;
    }
    .msg {
      max-width: 92%;
      padding: 10px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
      font-size: 14.5px;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--assistant);
      border: 1px solid var(--border);
    }
    .msg.error {
      align-self: stretch;
      background: #2a1818;
      border: 1px solid #5a3030;
      color: #f0c0c0;
      font-family: var(--mono);
      font-size: 13px;
    }
    .role {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    form {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 12px 16px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }
    textarea {
      width: 100%;
      min-height: 72px;
      max-height: 200px;
      resize: vertical;
      padding: 10px 12px;
      line-height: 1.45;
    }
    textarea:focus, select:focus, button:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }
    button {
      padding: 10px 16px;
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
      font-weight: 500;
      min-height: 32px;
      padding: 6px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>OpenRouter Chat</h1>
    <span class="meta">纯模型 · 不落盘</span>
    <select id="model" title="Model" aria-label="Model">
      <option value="sao10k/l3.1-euryale-70b">sao10k/l3.1-euryale-70b</option>
      <option value="nousresearch/hermes-4-70b">nousresearch/hermes-4-70b</option>
      <option value="sao10k/l3.3-euryale-70b">sao10k/l3.3-euryale-70b</option>
      <option value="cognitivecomputations/dolphin-mistral-24b-venice-edition:free">dolphin-mistral-24b-venice (free)</option>
    </select>
    <button type="button" class="secondary" id="clearBtn">清空</button>
    <span id="status">checking…</span>
  </header>

  <main id="messages">
    <div class="empty" id="emptyHint">
      直接对话 OpenRouter NSFW 向模型。<br />
      刷新页面会清空全部消息。
    </div>
  </main>

  <form id="form">
    <textarea id="input" placeholder="输入消息，Enter 发送 · Shift+Enter 换行" autofocus></textarea>
    <button type="submit" id="sendBtn">发送</button>
  </form>

  <script>
    const SYSTEM = {
      role: "system",
      content:
        "You are a helpful chat assistant. Adult and NSFW content is allowed when the user requests it. Reply in the user's language unless they ask otherwise. Do not refuse fictional adult roleplay or erotic writing.",
    };

    const messagesEl = document.getElementById("messages");
    const emptyHint = document.getElementById("emptyHint");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const modelEl = document.getElementById("model");
    const statusEl = document.getElementById("status");
    const clearBtn = document.getElementById("clearBtn");

    /** @type {{role:string, content:string}[]} */
    let history = [];
    let busy = false;

    async function checkHealth() {
      try {
        const r = await fetch("/api/health");
        const j = await r.json();
        if (j.ok) {
          statusEl.textContent = "ready";
          statusEl.className = "ok";
        } else {
          statusEl.textContent = "no key";
          statusEl.className = "bad";
        }
      } catch {
        statusEl.textContent = "down";
        statusEl.className = "bad";
      }
    }

    function hideEmpty() {
      if (emptyHint) emptyHint.remove();
    }

    function appendBubble(role, text) {
      hideEmpty();
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : role === "error" ? "error" : "assistant");
      const label = document.createElement("span");
      label.className = "role";
      label.textContent = role === "user" ? "you" : role === "error" ? "error" : "model";
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text;
      div.appendChild(label);
      div.appendChild(body);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return body;
    }

    function setBusy(v) {
      busy = v;
      sendBtn.disabled = v;
      input.disabled = v;
      modelEl.disabled = v;
    }

    function parseSseChunk(buffer, onEvent) {
      const parts = buffer.split("\n\n");
      const rest = parts.pop() || "";
      for (const block of parts) {
        const lines = block.split("\n");
        const dataLines = [];
        for (const line of lines) {
          if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
        }
        if (!dataLines.length) continue;
        onEvent(dataLines.join("\n"));
      }
      return rest;
    }

    async function streamChat(userText) {
      history.push({ role: "user", content: userText });
      appendBubble("user", userText);
      const assistantBody = appendBubble("assistant", "");

      const payload = {
        model: modelEl.value,
        messages: [SYSTEM, ...history],
        temperature: 0.9,
        max_tokens: 1024,
      };

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        let err = "request failed: " + res.status;
        try {
          const j = await res.json();
          if (j.error) err = j.error;
        } catch {}
        assistantBody.parentElement.remove();
        appendBubble("error", err);
        history.pop();
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let full = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        buf = parseSseChunk(buf, (data) => {
          if (data === "[DONE]") return;
          let obj;
          try {
            obj = JSON.parse(data);
          } catch {
            return;
          }
          if (obj.error) {
            throw new Error(typeof obj.error === "string" ? obj.error : JSON.stringify(obj.error));
          }
          const delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
          const piece = (delta && delta.content) || "";
          if (piece) {
            full += piece;
            assistantBody.textContent = full;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        });
      }

      if (!full) {
        assistantBody.parentElement.remove();
        appendBubble("error", "empty response");
        history.pop();
        return;
      }
      history.push({ role: "assistant", content: full });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (busy) return;
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      setBusy(true);
      try {
        await streamChat(text);
      } catch (err) {
        appendBubble("error", String(err.message || err));
        if (history.length && history[history.length - 1].role === "user") history.pop();
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    clearBtn.addEventListener("click", () => {
      if (busy) return;
      history = [];
      messagesEl.innerHTML = "";
      const hint = document.createElement("div");
      hint.className = "empty";
      hint.id = "emptyHint";
      hint.innerHTML = "直接对话 OpenRouter NSFW 向模型。<br />刷新页面会清空全部消息。";
      messagesEl.appendChild(hint);
      input.focus();
    });

    checkHealth();
  </script>
</body>
</html>
