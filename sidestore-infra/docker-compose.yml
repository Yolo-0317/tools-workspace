services:
  anisette:
    image: docker.m.daocloud.io/dadoum/anisette-v3-server:latest
    container_name: sidestore-anisette
    restart: unless-stopped
    environment:
      HOME: /home/Alcoholic
      TZ: ${TZ}
    volumes:
      # 持久化整棵 anisette-v3（含 device.json / adi.pb），避免重启后机器重配导致登录失败
      - ./anisette/data:/home/Alcoholic/.config/anisette-v3
    networks:
      sidestore_net:
        ipv4_address: 172.28.0.2
    ports:
      - "127.0.0.1:${ANISETTE_PORT:-6969}:6969"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:6969/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: docker.m.daocloud.io/library/caddy:2.9-alpine
    container_name: sidestore-caddy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "${INTERNAL_HTTPS_PORT:-8443}:443"
      - "${EXTERNAL_HTTPS_PORT:-8883}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - ./public:/srv:ro
      - ../readalong:/readalong:ro
    networks:
      - sidestore_net
    depends_on:
      anisette:
        condition: service_healthy

networks:
  sidestore_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
